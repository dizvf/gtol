name: Build Windows test app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish a standalone exe
        shell: pwsh
        run: |
          dotnet publish GTOL.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Content -LiteralPath publish/version.txt -Value '${{ github.sha }}'
          Compress-Archive -Path publish/* -DestinationPath gtol-win-x64.zip -Force
      - name: Publish test prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 'build-${{ github.run_number }}' gtol-win-x64.zip --title 'GTOL test build ${{ github.run_number }}' --notes 'Standalone Windows test app.' --prerelease
